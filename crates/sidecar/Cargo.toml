[package]
name = "sidecar"
version = "0.1.0"
description = "Connects a stock t3 server to phones over the sync protocol, on the WebRTC data channel or a WebSocket."
edition = "2024"
publish = false

[dependencies]
pipe = { path = "../pipe" }
sync-core = { path = "../sync-core" }
base64 = "0.23.1"
getrandom = "0.4.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
str0m = { version = "0.25.0", default-features = false, features = ["aws-lc-rs"] }
toml = "1.2.1"
tungstenite = "0.30.0"
ureq = "3.5.1"

[dev-dependencies]
native-phone = { path = "../native-phone" }
