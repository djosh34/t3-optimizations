[package]
name = "pipe"
version = "0.1.0"
description = "Server side of the WebRTC data channel to the phone, on str0m."
edition = "2024"
publish = false

[dependencies]
# aws-lc-rs is str0m's default crypto; the other default feature only builds
# its examples.
str0m = { version = "0.25.0", default-features = false, features = ["aws-lc-rs"] }
tiny_http = "0.12.0"
# Derived ICE credentials (src/creds.rs).
base64 = "0.23.1"
hmac = "0.13.0"
sha2 = "0.11.1"
