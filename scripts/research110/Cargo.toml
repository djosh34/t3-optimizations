# Run from the repo root:
# cargo run --release --manifest-path scripts/research110/Cargo.toml --target-dir /tmp/research110-target
[package]
name = "research-110"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
sync-core = { path = "../../crates/sync-core" }
phone-wasm = { path = "../../crates/phone-wasm" }
serde_json = "1"
sha2 = "0.11.1"

[[bin]]
name = "research-110"
path = "probe.rs"
